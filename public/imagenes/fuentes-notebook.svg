<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">No todo lo que subes suma</title>
<desc id="desc">Tres filtros separan fuentes primarias y legibles de resúmenes y escaneos; solo lo que pasa entra en el cuaderno.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="1200" height="630" fill="#f6f8fc"/>
<circle cx="1112" cy="58" r="150" fill="#dce9ff" opacity="0.75"/>
<circle cx="72" cy="594" r="96" fill="#dce9ff" opacity="0.55"/>
<text x="64" y="66" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="#2563eb">Módulo 2 · Fuentes</text>
<text x="64" y="126" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="800" fill="#0c1424">No todo lo que subes suma</text>
<text x="64" y="162" font-family="Inter, system-ui, sans-serif" font-size="21" fill="#46536a">Tres filtros antes de crear el cuaderno</text>

<text x="64" y="208" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#46536a">CANDIDATAS</text>
<g font-family="Inter, system-ui, sans-serif">
  <rect x="64" y="224" width="250" height="70" rx="14" fill="#ffffff" stroke="#86efac"/>
  <circle cx="92" cy="259" r="13" fill="#dcfce7"/><text x="92" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">1</text>
  <text x="118" y="254" font-size="19" font-weight="700" fill="#0c1424">Apuntes propios</text>
  <text x="118" y="274" font-size="15" fill="#46536a">Texto editable</text>

  <rect x="64" y="310" width="250" height="70" rx="14" fill="#ffffff" stroke="#86efac"/>
  <circle cx="92" cy="345" r="13" fill="#dcfce7"/><text x="92" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">2</text>
  <text x="118" y="340" font-size="19" font-weight="700" fill="#0c1424">Capítulo del libro</text>
  <text x="118" y="360" font-size="15" fill="#46536a">Páginas concretas</text>

  <rect x="64" y="396" width="250" height="70" rx="14" fill="#ffffff" stroke="#86efac"/>
  <circle cx="92" cy="431" r="13" fill="#dcfce7"/><text x="92" y="436" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">3</text>
  <text x="118" y="426" font-size="19" font-weight="700" fill="#0c1424">Norma oficial</text>
  <text x="118" y="446" font-size="15" fill="#46536a">Versión vigente</text>
</g>

<path d="M322 355 H360" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

<g font-family="Inter, system-ui, sans-serif">
  <text x="370" y="208" font-size="15" font-weight="700" fill="#46536a">TRES FILTROS</text>
  <rect x="370" y="224" width="340" height="70" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="390" y="252" font-size="16" font-weight="700" fill="#1d4ed8">1 · ¿Es fuente primaria?</text>
  <text x="390" y="274" font-size="15" fill="#46536a">Temario, libro, norma o apuntes propios.</text>

  <rect x="370" y="310" width="340" height="70" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="390" y="338" font-size="16" font-weight="700" fill="#1d4ed8">2 · ¿Tiene texto legible?</text>
  <text x="390" y="360" font-size="15" fill="#46536a">Si es un escaneo, pásalo antes por OCR.</text>

  <rect x="370" y="396" width="340" height="70" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="390" y="424" font-size="16" font-weight="700" fill="#1d4ed8">3 · ¿Es una sola unidad?</text>
  <text x="390" y="446" font-size="15" fill="#46536a">Un cuaderno por tema, no cuarenta PDF.</text>
</g>

<path d="M712 355 H750" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

<rect x="760" y="218" width="376" height="252" rx="20" fill="#1e3a8a"/>
<g font-family="Inter, system-ui, sans-serif">
  <text x="790" y="258" font-size="15" font-weight="700" fill="#93c5fd">CUADERNO</text>
  <text x="790" y="298" font-size="28" font-weight="800" fill="#ffffff">3 fuentes útiles</text>
  <text x="790" y="330" font-size="17" fill="#dce9ff">Responde con cita y fragmento.</text>
  <text x="790" y="354" font-size="17" fill="#dce9ff">Si no está, escribe «no consta».</text>
  <rect x="790" y="390" width="216" height="42" rx="21" fill="#2563eb"/>
  <text x="898" y="417" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">¿Qué dice mi tema?</text>
</g>

<g font-family="Inter, system-ui, sans-serif">
  <rect x="64" y="500" width="500" height="62" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="84" y="522" font-size="15" font-weight="700" fill="#b91c1c">Fuera · resumen de resumen</text>
  <text x="84" y="544" font-size="14" fill="#7f1d1d">Interpreta una interpretación.</text>
  <rect x="584" y="500" width="552" height="62" rx="12" fill="#fffbeb" stroke="#fde68a"/>
  <text x="604" y="522" font-size="15" font-weight="700" fill="#92400e">Fuera · PDF escaneado sin OCR</text>
  <text x="604" y="544" font-size="14" fill="#78350f">El cuaderno no puede leerlo bien.</text>
</g>
<text x="64" y="600" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#46536a">La IA no arregla una fuente mala: solo la repite con más seguridad.</text>
</svg>
