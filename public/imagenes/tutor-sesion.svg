<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Guion de una sesión de 20 minutos</title>
<desc id="desc">Cuatro tramos de tutoría: diagnóstico, intento, corrección y transferencia, con ejemplos de diálogo.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="1200" height="630" fill="#f6f8fc"/>
<circle cx="1112" cy="58" r="150" fill="#dce9ff" opacity="0.75"/>
<circle cx="72" cy="594" r="96" fill="#dce9ff" opacity="0.55"/>
<text x="64" y="66" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="#2563eb">Módulo 3 · Sesión de tutoría</text>
<text x="64" y="126" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="800" fill="#0c1424">Guion de una sesión de 20 minutos</text>
<text x="64" y="162" font-family="Inter, system-ui, sans-serif" font-size="21" fill="#46536a">El tutor pregunta, espera, corrige y transfiere</text>

<g font-family="Inter, system-ui, sans-serif">
  <rect x="64" y="208" width="250" height="252" rx="18" fill="#ffffff" stroke="#e1e7f0"/>
  <rect x="64" y="208" width="250" height="48" rx="18" fill="#eff6ff"/>
  <rect x="64" y="238" width="250" height="18" fill="#eff6ff"/>
  <text x="88" y="239" font-size="15" font-weight="700" fill="#1d4ed8">0–3 MIN</text>
  <text x="88" y="288" font-size="21" font-weight="700" fill="#0c1424">Diagnóstico</text>
  <text x="88" y="318" font-size="15" fill="#46536a">«¿Qué sabes ya de</text>
  <text x="88" y="338" font-size="15" fill="#46536a">este tema?»</text>
  <rect x="88" y="364" width="202" height="1" fill="#e1e7f0"/>
  <text x="88" y="394" font-size="15" font-weight="700" fill="#2563eb">El alumno habla</text>
  <text x="88" y="416" font-size="15" fill="#46536a">El tutor escucha y</text>
  <text x="88" y="436" font-size="15" fill="#46536a">localiza la laguna.</text>

  <rect x="334" y="208" width="250" height="252" rx="18" fill="#ffffff" stroke="#e1e7f0"/>
  <rect x="334" y="208" width="250" height="48" rx="18" fill="#fffbeb"/>
  <rect x="334" y="238" width="250" height="18" fill="#fffbeb"/>
  <text x="358" y="239" font-size="15" font-weight="700" fill="#92400e">3–8 MIN</text>
  <text x="358" y="288" font-size="21" font-weight="700" fill="#0c1424">Intento</text>
  <text x="358" y="318" font-size="15" fill="#46536a">«Responde sin mirar</text>
  <text x="358" y="338" font-size="15" fill="#46536a">los apuntes.»</text>
  <rect x="358" y="364" width="202" height="1" fill="#e1e7f0"/>
  <text x="358" y="394" font-size="15" font-weight="700" fill="#2563eb">Sin respuesta aún</text>
  <text x="358" y="416" font-size="15" fill="#46536a">El error es el dato</text>
  <text x="358" y="436" font-size="15" fill="#46536a">que guía la pista.</text>

  <rect x="604" y="208" width="250" height="252" rx="18" fill="#ffffff" stroke="#e1e7f0"/>
  <rect x="604" y="208" width="250" height="48" rx="18" fill="#fffbeb"/>
  <rect x="604" y="238" width="250" height="18" fill="#fffbeb"/>
  <text x="628" y="239" font-size="15" font-weight="700" fill="#92400e">8–15 MIN</text>
  <text x="628" y="288" font-size="21" font-weight="700" fill="#0c1424">Corrección</text>
  <text x="628" y="318" font-size="15" fill="#46536a">Pista → explicación</text>
  <text x="628" y="338" font-size="15" fill="#46536a">→ repetir con tus palabras.</text>
  <rect x="628" y="364" width="202" height="1" fill="#e1e7f0"/>
  <text x="628" y="394" font-size="15" font-weight="700" fill="#2563eb">Primero la pista</text>
  <text x="628" y="416" font-size="15" fill="#46536a">La solución completa</text>
  <text x="628" y="436" font-size="15" fill="#46536a">solo si vuelve a fallar.</text>

  <rect x="874" y="208" width="262" height="252" rx="18" fill="#ffffff" stroke="#e1e7f0"/>
  <rect x="874" y="208" width="262" height="48" rx="18" fill="#f0fdf4"/>
  <rect x="874" y="238" width="262" height="18" fill="#f0fdf4"/>
  <text x="898" y="239" font-size="15" font-weight="700" fill="#15803d">15–20 MIN</text>
  <text x="898" y="288" font-size="21" font-weight="700" fill="#0c1424">Transferencia</text>
  <text x="898" y="318" font-size="15" fill="#46536a">Un ejemplo nuevo</text>
  <text x="898" y="338" font-size="15" fill="#46536a">y dos preguntas.</text>
  <rect x="898" y="364" width="214" height="1" fill="#e1e7f0"/>
  <text x="898" y="394" font-size="15" font-weight="700" fill="#15803d">Cierre con plan</text>
  <text x="898" y="416" font-size="15" fill="#46536a">Qué repasar y</text>
  <text x="898" y="436" font-size="15" fill="#46536a">cuándo volver.</text>
</g>

<g stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)">
  <path d="M314 334 H328"/>
  <path d="M584 334 H598"/>
  <path d="M854 334 H868"/>
</g>

<rect x="64" y="500" width="1072" height="56" rx="14" fill="#1e3a8a"/>
<text x="92" y="535" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Si el tutor habla más que el alumno, la sesión ha dejado de ser una tutoría.</text>
</svg>
