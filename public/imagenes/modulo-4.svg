<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Un caso, tres preguntas</title>
<desc id="desc">Un análisis de campaña se contrasta con la tabla y se clasifican sus afirmaciones.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="1200" height="630" fill="#f6f8fc"/>
<circle cx="1112" cy="58" r="150" fill="#dce9ff" opacity="0.75"/>
<circle cx="72" cy="594" r="96" fill="#dce9ff" opacity="0.55"/>
<text x="64" y="66" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="#2563eb">Módulo 4 · Casos de aula</text>
<text x="64" y="126" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="800" fill="#0c1424">Un caso, tres preguntas</text>
<text x="64" y="162" font-family="Inter, system-ui, sans-serif" font-size="21" fill="#46536a">Clasificar la afirmación antes de corregir el trabajo</text>
<rect x="64" y="204" width="430" height="330" rx="20" fill="#ffffff" stroke="#e1e7f0"/>
<g font-family="Inter, system-ui, sans-serif">
  <text x="92" y="244" font-size="16" font-weight="700" fill="#46536a">ANÁLISIS DE CAMPAÑA</text>
  <rect x="394" y="222" width="72" height="32" rx="16" fill="#fee2e2"/>
  <text x="430" y="243" text-anchor="middle" font-size="17" font-weight="700" fill="#b91c1c">40 %</text>
  <text x="92" y="286" font-size="21" font-weight="700" fill="#0c1424">«Las ventas crecieron un 40 %»</text>
  <rect x="92" y="310" width="374" height="98" rx="12" fill="#f6f8fc" stroke="#e1e7f0"/>
  <text x="110" y="340" font-size="16" fill="#46536a">Periodo</text><text x="250" y="340" font-size="16" fill="#46536a">Ventas</text><text x="366" y="340" font-size="16" fill="#46536a">Var.</text>
  <text x="110" y="370" font-size="17" fill="#0c1424">Octubre</text><text x="250" y="370" font-size="17" fill="#0c1424">1.240</text><text x="366" y="370" font-size="17" font-weight="700" fill="#b91c1c">+12 %</text>
  <text x="110" y="396" font-size="17" fill="#0c1424">Noviembre</text><text x="250" y="396" font-size="17" fill="#0c1424">1.388</text>
  <text x="92" y="448" font-size="17" fill="#46536a">La tabla no respalda el 40 %.</text>
  <text x="92" y="482" font-size="17" font-weight="700" fill="#b91c1c">→ Dato inventado</text>
</g>
<g font-family="Inter, system-ui, sans-serif">
  <rect x="540" y="204" width="596" height="86" rx="16" fill="#ffffff" stroke="#fecaca"/>
  <circle cx="570" cy="247" r="9" fill="#ef4444"/>
  <text x="594" y="240" font-size="20" font-weight="700" fill="#0c1424">Dato inventado</text>
  <text x="594" y="263" font-size="17" fill="#46536a">La cifra no aparece en la tabla.</text>
  <rect x="540" y="302" width="596" height="86" rx="16" fill="#ffffff" stroke="#fde68a"/>
  <circle cx="570" cy="345" r="9" fill="#f59e0b"/>
  <text x="594" y="338" font-size="20" font-weight="700" fill="#0c1424">Dato mal interpretado</text>
  <text x="594" y="361" font-size="17" fill="#46536a">Más impresiones no significan más conversión.</text>
  <rect x="540" y="400" width="596" height="86" rx="16" fill="#ffffff" stroke="#bfdbfe"/>
  <circle cx="570" cy="443" r="9" fill="#2563eb"/>
  <text x="594" y="436" font-size="20" font-weight="700" fill="#0c1424">Opinión sin evidencia</text>
  <text x="594" y="459" font-size="17" fill="#46536a">«Fue un éxito» no define el objetivo.</text>
</g>
<g font-family="Inter, system-ui, sans-serif">
  <rect x="64" y="552" width="340" height="48" rx="24" fill="#1e3a8a"/>
  <text x="234" y="582" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">¿De qué fila sale el 40 %?</text>
  <rect x="428" y="552" width="340" height="48" rx="24" fill="#1e3a8a"/>
  <text x="598" y="582" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">¿Qué métrica usaste?</text>
  <rect x="792" y="552" width="340" height="48" rx="24" fill="#1e3a8a"/>
  <text x="962" y="582" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">¿Qué falta para probarlo?</text>
</g>
</svg>
