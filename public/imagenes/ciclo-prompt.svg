<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Del prompt al diálogo</title>
<desc id="desc">Cinco pasos en bucle: borrador, defecto concreto, variantes, fijar lo que funciona y comprobación final.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="1200" height="630" fill="#f6f8fc"/>
<circle cx="1112" cy="58" r="150" fill="#dce9ff" opacity="0.75"/>
<circle cx="72" cy="594" r="96" fill="#dce9ff" opacity="0.55"/>
<text x="64" y="66" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="#2563eb">Módulo 1 · Iteración</text>
<text x="64" y="126" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="800" fill="#0c1424">Del prompt al diálogo</text>
<text x="64" y="162" font-family="Inter, system-ui, sans-serif" font-size="21" fill="#46536a">Un prompt no es una apuesta única: es el primer turno.</text>

<g font-family="Inter, system-ui, sans-serif">
  <rect x="56" y="238" width="196" height="154" rx="18" fill="#ffffff" stroke="#e1e7f0"/>
  <circle cx="86" cy="270" r="17" fill="#dce9ff"/><text x="86" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">1</text>
  <text x="114" y="276" font-size="19" font-weight="700" fill="#0c1424">Borrador</text>
  <text x="80" y="310" font-size="16" fill="#46536a">Pide una primera</text>
  <text x="80" y="332" font-size="16" fill="#46536a">versión sin buscar</text>
  <text x="80" y="354" font-size="16" fill="#46536a">la perfección.</text>

  <rect x="278" y="238" width="196" height="154" rx="18" fill="#ffffff" stroke="#e1e7f0"/>
  <circle cx="308" cy="270" r="17" fill="#dce9ff"/><text x="308" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">2</text>
  <text x="336" y="276" font-size="19" font-weight="700" fill="#0c1424">Defecto</text>
  <text x="302" y="310" font-size="16" fill="#46536a">Señala qué falla:</text>
  <text x="302" y="332" font-size="16" fill="#46536a">«el apartado 3</text>
  <text x="302" y="354" font-size="16" fill="#46536a">es genérico».</text>

  <rect x="500" y="238" width="196" height="154" rx="18" fill="#ffffff" stroke="#e1e7f0"/>
  <circle cx="530" cy="270" r="17" fill="#dce9ff"/><text x="530" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">3</text>
  <text x="558" y="276" font-size="19" font-weight="700" fill="#0c1424">Variantes</text>
  <text x="524" y="310" font-size="16" fill="#46536a">Pide dos versiones:</text>
  <text x="524" y="332" font-size="16" fill="#46536a">más breve y con</text>
  <text x="524" y="354" font-size="16" fill="#46536a">un ejemplo cercano.</text>

  <rect x="722" y="238" width="196" height="154" rx="18" fill="#ffffff" stroke="#e1e7f0"/>
  <circle cx="752" cy="270" r="17" fill="#dce9ff"/><text x="752" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">4</text>
  <text x="780" y="276" font-size="19" font-weight="700" fill="#0c1424">Fija</text>
  <text x="746" y="310" font-size="16" fill="#46536a">Conserva estructura</text>
  <text x="746" y="332" font-size="16" fill="#46536a">y tono; cambia solo</text>
  <text x="746" y="354" font-size="16" fill="#46536a">lo que no funciona.</text>

  <rect x="944" y="238" width="196" height="154" rx="18" fill="#ffffff" stroke="#22c55e"/>
  <circle cx="974" cy="270" r="17" fill="#f0fdf4"/><text x="974" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">5</text>
  <text x="1002" y="276" font-size="19" font-weight="700" fill="#0c1424">Comprueba</text>
  <text x="968" y="310" font-size="16" fill="#46536a">«¿Qué afirmaciones</text>
  <text x="968" y="332" font-size="16" fill="#46536a">debo verificar y</text>
  <text x="968" y="354" font-size="16" fill="#46536a">cómo?».</text>
</g>

<path d="M252 315 H270" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M474 315 H492" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M696 315 H714" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M918 315 H936" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1042 400 V440 H154 V400" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<text x="598" y="432" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#64748b">La conversación continúa mientras el resultado no sea verificable.</text>

<rect x="64" y="480" width="1072" height="84" rx="16" fill="#1e3a8a"/>
<text x="92" y="514" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">No cambies el prompt entero: corrige una pieza y vuelve a probar.</text>
<text x="92" y="542" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#dbeafe">Rol, contexto, tarea, formato y restricciones son las cinco piezas que puedes ajustar.</text>
</svg>
