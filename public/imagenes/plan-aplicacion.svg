<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">El plan cabe en una página</title>
<desc id="desc">Plan de aplicación con qué cambia, con quién, cómo, qué prueba y cuándo; a la derecha, señales de que funciona.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="1200" height="630" fill="#f6f8fc"/>
<circle cx="1112" cy="58" r="150" fill="#dce9ff" opacity="0.75"/>
<circle cx="72" cy="594" r="96" fill="#dce9ff" opacity="0.55"/>
<text x="64" y="66" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="#2563eb">Módulo 4 · Plan de aplicación</text>
<text x="64" y="126" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="800" fill="#0c1424">El plan cabe en una página</text>
<text x="64" y="162" font-family="Inter, system-ui, sans-serif" font-size="21" fill="#46536a">Si no tiene fecha y una prueba, no es un plan: es una intención</text>

<rect x="64" y="202" width="716" height="352" rx="18" fill="#ffffff" stroke="#e1e7f0" stroke-width="2"/>
<text x="92" y="238" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2563eb">PLAN DE APLICACIÓN · 4.º ESO · HISTORIA</text>
<rect x="92" y="252" width="660" height="1" fill="#e1e7f0"/>

<g font-family="Inter, system-ui, sans-serif">
  <circle cx="108" cy="288" r="15" fill="#dce9ff"/><text x="108" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">1</text>
  <text x="136" y="284" font-size="14" font-weight="700" fill="#46536a">QUÉ CAMBIO</text>
  <text x="136" y="307" font-size="18" fill="#0c1424">Pedir una defensa oral breve antes de corregir el trabajo.</text>

  <circle cx="108" cy="348" r="15" fill="#dce9ff"/><text x="108" y="354" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">2</text>
  <text x="136" y="344" font-size="14" font-weight="700" fill="#46536a">CON QUIÉN</text>
  <text x="136" y="367" font-size="18" fill="#0c1424">4.º ESO · Historia · grupo B · 24 alumnos.</text>

  <circle cx="108" cy="408" r="15" fill="#dce9ff"/><text x="108" y="414" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">3</text>
  <text x="136" y="404" font-size="14" font-weight="700" fill="#46536a">CÓMO</text>
  <text x="136" y="427" font-size="18" fill="#0c1424">Tres preguntas y una rúbrica de cuatro criterios.</text>

  <circle cx="108" cy="468" r="15" fill="#dce9ff"/><text x="108" y="474" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">4</text>
  <text x="136" y="464" font-size="14" font-weight="700" fill="#46536a">QUÉ LO PRUEBA</text>
  <text x="136" y="487" font-size="18" fill="#0c1424">Dos trabajos al azar: ¿explica el proceso sin leer?</text>

  <circle cx="108" cy="528" r="15" fill="#f0fdf4"/><text x="108" y="534" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">5</text>
  <text x="136" y="524" font-size="14" font-weight="700" fill="#15803d">CUÁNDO</text>
  <text x="136" y="547" font-size="18" font-weight="700" fill="#0c1424">Martes 24, en la sesión de repaso.</text>
</g>

<rect x="810" y="202" width="326" height="352" rx="18" fill="#1e3a8a"/>
<g font-family="Inter, system-ui, sans-serif">
  <text x="838" y="242" font-size="15" font-weight="700" fill="#93c5fd">SEÑAL DE QUE FUNCIONA</text>
  <rect x="838" y="264" width="270" height="66" rx="12" fill="#24488f"/>
  <text x="856" y="291" font-size="16" font-weight="700" fill="#ffffff">El alumno explica</text>
  <text x="856" y="313" font-size="15" fill="#dce9ff">sin leer el trabajo.</text>
  <rect x="838" y="344" width="270" height="66" rx="12" fill="#24488f"/>
  <text x="856" y="371" font-size="16" font-weight="700" fill="#ffffff">Cita fuentes reales</text>
  <text x="856" y="393" font-size="15" fill="#dce9ff">y sabe de dónde salen.</text>
  <rect x="838" y="424" width="270" height="66" rx="12" fill="#24488f"/>
  <text x="856" y="451" font-size="16" font-weight="700" fill="#ffffff">La nota no baja</text>
  <text x="856" y="473" font-size="15" fill="#dce9ff">por haber usado IA.</text>
  <text x="838" y="522" font-size="15" fill="#93c5fd">Tres medidas, un indicador, una fecha.</text>
</g>

<text x="64" y="600" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#46536a">Un plan pequeño que se ejecuta vale más que uno ambicioso que se queda en la libreta.</text>
</svg>
