<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Del documento a la cita</title>
<desc id="desc">Tres fuentes entran en un cuaderno y salen resumen, cuestionario y mapa con referencias.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="1200" height="630" fill="#f6f8fc"/>
<circle cx="1112" cy="58" r="150" fill="#dce9ff" opacity="0.75"/>
<circle cx="72" cy="594" r="96" fill="#dce9ff" opacity="0.55"/>
<text x="64" y="66" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="#2563eb">Módulo 2 · NotebookLM</text>
<text x="64" y="126" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="800" fill="#0c1424">Del documento a la cita</text>
<text x="64" y="162" font-family="Inter, system-ui, sans-serif" font-size="21" fill="#46536a">Un cuaderno que responde solo con las fuentes que le das</text>
<text x="64" y="208" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#46536a">FUENTES</text>
<g font-family="Inter, system-ui, sans-serif">
  <rect x="64" y="224" width="250" height="78" rx="16" fill="#ffffff" stroke="#e1e7f0"/>
  <rect x="82" y="242" width="38" height="42" rx="6" fill="#dce9ff"/><text x="101" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">PDF</text>
  <text x="134" y="258" font-size="20" font-weight="700" fill="#0c1424">Apuntes</text><text x="134" y="278" font-size="16" fill="#46536a">Tema de clase</text>
  <rect x="64" y="314" width="250" height="78" rx="16" fill="#ffffff" stroke="#e1e7f0"/>
  <rect x="82" y="332" width="38" height="42" rx="6" fill="#dce9ff"/><text x="101" y="358" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">PDF</text>
  <text x="134" y="348" font-size="20" font-weight="700" fill="#0c1424">Libro</text><text x="134" y="368" font-size="16" fill="#46536a">Capítulo 6</text>
  <rect x="64" y="404" width="250" height="78" rx="16" fill="#ffffff" stroke="#e1e7f0"/>
  <rect x="82" y="422" width="38" height="42" rx="6" fill="#dce9ff"/><text x="101" y="448" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">PDF</text>
  <text x="134" y="438" font-size="20" font-weight="700" fill="#0c1424">Normativa</text><text x="134" y="458" font-size="16" fill="#46536a">Texto oficial</text>
</g>
<path d="M322 353 H360" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="370" y="224" width="290" height="258" rx="20" fill="#1e3a8a"/>
<g font-family="Inter, system-ui, sans-serif">
  <text x="398" y="264" font-size="16" font-weight="700" fill="#93c5fd">CUADERNO</text>
  <text x="398" y="302" font-size="27" font-weight="800" fill="#ffffff">3 fuentes</text>
  <text x="398" y="334" font-size="18" fill="#dce9ff">Responde con citas.</text>
  <text x="398" y="358" font-size="18" fill="#dce9ff">Si no está, lo dice.</text>
  <rect x="398" y="396" width="190" height="42" rx="21" fill="#2563eb"/>
  <text x="493" y="423" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">¿Qué dice mi tema?</text>
</g>
<path d="M668 353 H706" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<g font-family="Inter, system-ui, sans-serif">
  <rect x="720" y="224" width="416" height="78" rx="16" fill="#ffffff" stroke="#e1e7f0"/>
  <circle cx="752" cy="263" r="15" fill="#f0fdf4"/><text x="752" y="269" text-anchor="middle" font-size="16" fill="#15803d">✓</text>
  <text x="782" y="258" font-size="20" font-weight="700" fill="#0c1424">Resumen con citas</text><text x="782" y="278" font-size="16" fill="#46536a">Cada idea lleva su fuente</text>
  <rect x="720" y="314" width="416" height="78" rx="16" fill="#ffffff" stroke="#e1e7f0"/>
  <circle cx="752" cy="353" r="15" fill="#fffbeb"/><text x="752" y="359" text-anchor="middle" font-size="16" fill="#92400e">?</text>
  <text x="782" y="348" font-size="20" font-weight="700" fill="#0c1424">Cuestionario</text><text x="782" y="368" font-size="16" fill="#46536a">Preguntas para recuperar</text>
  <rect x="720" y="404" width="416" height="78" rx="16" fill="#ffffff" stroke="#e1e7f0"/>
  <circle cx="752" cy="443" r="15" fill="#dce9ff"/><text x="752" y="449" text-anchor="middle" font-size="16" fill="#1d4ed8">↗</text>
  <text x="782" y="438" font-size="20" font-weight="700" fill="#0c1424">Mapa mental</text><text x="782" y="458" font-size="16" fill="#46536a">Relaciones entre conceptos</text>
</g>
<text x="64" y="540" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#46536a">Cada afirmación conserva su fuente. Si las fuentes discrepan, el cuaderno lo marca.</text>
</svg>
