<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Un caso, tres preguntas</title>
<desc id="desc">Marco para analizar un caso: qué pasó, qué señal lo delata y qué conviene hacer.</desc>
<rect width="1200" height="630" fill="#f6f8fc"/>
<circle cx="1112" cy="58" r="150" fill="#dce9ff" opacity="0.75"/>
<circle cx="72" cy="594" r="96" fill="#dce9ff" opacity="0.55"/>
<text x="64" y="66" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="#2563eb">Módulo 4 · Casos de aula</text>
<text x="64" y="126" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="800" fill="#0c1424">Un caso, tres preguntas</text>
<text x="64" y="162" font-family="Inter, system-ui, sans-serif" font-size="21" fill="#46536a">El mismo marco sirve para una bibliografía inventada o un plazo mal resumido.</text>

<g font-family="Inter, system-ui, sans-serif">
  <rect x="64" y="208" width="336" height="286" rx="20" fill="#ffffff" stroke="#e1e7f0"/>
  <rect x="64" y="208" width="336" height="8" rx="4" fill="#2563eb"/>
  <text x="92" y="252" font-size="15" font-weight="700" fill="#2563eb">1 · QUÉ PASÓ</text>
  <text x="92" y="292" font-size="23" font-weight="700" fill="#0c1424">El hecho, sin juicio</text>
  <text x="92" y="326" font-size="17" fill="#46536a">Una afirmación, una entrega</text>
  <text x="92" y="350" font-size="17" fill="#46536a">o una respuesta que no</text>
  <text x="92" y="374" font-size="17" fill="#46536a">se sostiene.</text>
  <rect x="92" y="410" width="276" height="54" rx="12" fill="#eff6ff"/>
  <text x="110" y="434" font-size="15" font-weight="700" fill="#1e3a8a">Pregunta guía</text>
  <text x="110" y="454" font-size="15" fill="#1e3a8a">¿Qué vimos exactamente?</text>

  <rect x="432" y="208" width="336" height="286" rx="20" fill="#ffffff" stroke="#e1e7f0"/>
  <rect x="432" y="208" width="336" height="8" rx="4" fill="#f59e0b"/>
  <text x="460" y="252" font-size="15" font-weight="700" fill="#92400e">2 · QUÉ SEÑAL</text>
  <text x="460" y="292" font-size="23" font-weight="700" fill="#0c1424">La pista que lo delata</text>
  <text x="460" y="326" font-size="17" fill="#46536a">Una cita que no existe,</text>
  <text x="460" y="350" font-size="17" fill="#46536a">un dato que no cuadra,</text>
  <text x="460" y="374" font-size="17" fill="#46536a">una explicación que falla.</text>
  <rect x="460" y="410" width="276" height="54" rx="12" fill="#fffbeb"/>
  <text x="478" y="434" font-size="15" font-weight="700" fill="#92400e">Pregunta guía</text>
  <text x="478" y="454" font-size="15" fill="#92400e">¿Qué fuente lo desmiente?</text>

  <rect x="800" y="208" width="336" height="286" rx="20" fill="#ffffff" stroke="#e1e7f0"/>
  <rect x="800" y="208" width="336" height="8" rx="4" fill="#22c55e"/>
  <text x="828" y="252" font-size="15" font-weight="700" fill="#15803d">3 · QUÉ HACER</text>
  <text x="828" y="292" font-size="23" font-weight="700" fill="#0c1424">La medida, no el castigo</text>
  <text x="828" y="326" font-size="17" fill="#46536a">Volver a la fuente, pedir</text>
  <text x="828" y="350" font-size="17" fill="#46536a">el proceso o rehacer una</text>
  <text x="828" y="374" font-size="17" fill="#46536a">parte concreta.</text>
  <rect x="828" y="410" width="276" height="54" rx="12" fill="#f0fdf4"/>
  <text x="846" y="434" font-size="15" font-weight="700" fill="#15803d">Pregunta guía</text>
  <text x="846" y="454" font-size="15" fill="#15803d">¿Qué cambia la próxima vez?</text>
</g>

<rect x="64" y="532" width="1072" height="52" rx="14" fill="#1e3a8a"/>
<text x="92" y="565" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Primero se describe el caso; después se decide qué hacer con el trabajo.</text>
</svg>
