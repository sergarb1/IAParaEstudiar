<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Verificar no es releer</title>
<desc id="desc">Cinco comprobaciones concretas sobre fechas, citas, cálculos, normativa y explicación propia.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="1200" height="630" fill="#f6f8fc"/>
<circle cx="1112" cy="58" r="150" fill="#dce9ff" opacity="0.75"/>
<circle cx="72" cy="594" r="96" fill="#dce9ff" opacity="0.55"/>
<text x="64" y="66" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="#2563eb">Módulo 1 · Verificación</text>
<text x="64" y="126" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="800" fill="#0c1424">Verificar no es releer</text>
<text x="64" y="162" font-family="Inter, system-ui, sans-serif" font-size="21" fill="#46536a">Cinco comprobaciones que se hacen en menos de cinco minutos</text>

<g font-family="Inter, system-ui, sans-serif">
  <rect x="64" y="212" width="200" height="292" rx="18" fill="#ffffff" stroke="#e1e7f0"/>
  <circle cx="96" cy="246" r="17" fill="#dce9ff"/><text x="96" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">1</text>
  <text x="88" y="292" font-size="22" font-weight="700" fill="#0c1424">Fecha</text>
  <text x="88" y="322" font-size="17" fill="#46536a">«En 1879 se</text>
  <text x="88" y="344" font-size="17" fill="#46536a">inventó la</text>
  <text x="88" y="366" font-size="17" fill="#46536a">bombilla.»</text>
  <rect x="88" y="398" width="152" height="1" fill="#e1e7f0"/>
  <text x="88" y="430" font-size="16" font-weight="700" fill="#2563eb">Abre el libro</text>
  <text x="88" y="454" font-size="16" fill="#46536a">o la fuente</text>
  <text x="88" y="476" font-size="16" fill="#46536a">oficial.</text>

  <rect x="284" y="212" width="200" height="292" rx="18" fill="#ffffff" stroke="#e1e7f0"/>
  <circle cx="316" cy="246" r="17" fill="#dce9ff"/><text x="316" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">2</text>
  <text x="308" y="292" font-size="22" font-weight="700" fill="#0c1424">Cita</text>
  <text x="308" y="322" font-size="17" fill="#46536a">«Según el</text>
  <text x="308" y="344" font-size="17" fill="#46536a">informe de</text>
  <text x="308" y="366" font-size="17" fill="#46536a">2019…»</text>
  <rect x="308" y="398" width="152" height="1" fill="#e1e7f0"/>
  <text x="308" y="430" font-size="16" font-weight="700" fill="#2563eb">Busca la página</text>
  <text x="308" y="454" font-size="16" fill="#46536a">y lee el párrafo</text>
  <text x="308" y="476" font-size="16" fill="#46536a">completo.</text>

  <rect x="504" y="212" width="200" height="292" rx="18" fill="#ffffff" stroke="#e1e7f0"/>
  <circle cx="536" cy="246" r="17" fill="#dce9ff"/><text x="536" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">3</text>
  <text x="528" y="292" font-size="22" font-weight="700" fill="#0c1424">Cálculo</text>
  <text x="528" y="322" font-size="17" fill="#46536a">«Las ventas</text>
  <text x="528" y="344" font-size="17" fill="#46536a">crecieron</text>
  <text x="528" y="366" font-size="17" fill="#46536a">un 12 %.»</text>
  <rect x="528" y="398" width="152" height="1" fill="#e1e7f0"/>
  <text x="528" y="430" font-size="16" font-weight="700" fill="#2563eb">Rehaz la cuenta</text>
  <text x="528" y="454" font-size="16" fill="#46536a">con la tabla</text>
  <text x="528" y="476" font-size="16" fill="#46536a">original.</text>

  <rect x="724" y="212" width="200" height="292" rx="18" fill="#ffffff" stroke="#e1e7f0"/>
  <circle cx="756" cy="246" r="17" fill="#dce9ff"/><text x="756" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">4</text>
  <text x="748" y="292" font-size="22" font-weight="700" fill="#0c1424">Norma</text>
  <text x="748" y="322" font-size="17" fill="#46536a">«El plazo es</text>
  <text x="748" y="344" font-size="17" fill="#46536a">de diez días</text>
  <text x="748" y="366" font-size="17" fill="#46536a">hábiles.»</text>
  <rect x="748" y="398" width="152" height="1" fill="#e1e7f0"/>
  <text x="748" y="430" font-size="16" font-weight="700" fill="#2563eb">Comprueba</text>
  <text x="748" y="454" font-size="16" fill="#46536a">la versión</text>
  <text x="748" y="476" font-size="16" fill="#46536a">vigente.</text>

  <rect x="944" y="212" width="192" height="292" rx="18" fill="#ffffff" stroke="#e1e7f0"/>
  <circle cx="976" cy="246" r="17" fill="#dce9ff"/><text x="976" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">5</text>
  <text x="968" y="292" font-size="22" font-weight="700" fill="#0c1424">Voz</text>
  <text x="968" y="322" font-size="17" fill="#46536a">«Ya lo</text>
  <text x="968" y="344" font-size="17" fill="#46536a">entiendo.»</text>
  <rect x="968" y="398" width="144" height="1" fill="#e1e7f0"/>
  <text x="968" y="430" font-size="16" font-weight="700" fill="#2563eb">Explícalo</text>
  <text x="968" y="454" font-size="16" fill="#46536a">sin mirar.</text>
</g>

<g stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)">
  <path d="M264 358 H278"/>
  <path d="M484 358 H498"/>
  <path d="M704 358 H718"/>
  <path d="M924 358 H938"/>
</g>

<rect x="64" y="536" width="1072" height="54" rx="14" fill="#1e3a8a"/>
<text x="92" y="570" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Si no puedes explicarlo sin leerlo, todavía no lo has aprendido.</text>
<text x="920" y="570" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#93c5fd">La comprobación es tuya</text>
</svg>
