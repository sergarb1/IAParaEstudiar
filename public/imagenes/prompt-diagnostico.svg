<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Lo que el modelo decide por ti</title>
<desc id="desc">Una petición vaga deja cinco decisiones al modelo; una precisa las toma el docente.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="1200" height="630" fill="#f6f8fc"/>
<circle cx="1112" cy="58" r="150" fill="#dce9ff" opacity="0.75"/>
<circle cx="72" cy="594" r="96" fill="#dce9ff" opacity="0.55"/>
<text x="64" y="66" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="#2563eb">Módulo 1 · Del prompt al resultado</text>
<text x="64" y="126" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="800" fill="#0c1424">Lo que el modelo decide por ti</text>
<text x="64" y="162" font-family="Inter, system-ui, sans-serif" font-size="21" fill="#46536a">Cada hueco que no rellenas lo rellena otra persona: el modelo</text>

<rect x="64" y="204" width="430" height="338" rx="20" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
<rect x="64" y="204" width="430" height="58" rx="20" fill="#fef2f2"/>
<rect x="64" y="242" width="430" height="20" fill="#fef2f2"/>
<text x="92" y="240" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#b91c1c">PETICIÓN VAGA</text>
<rect x="88" y="282" width="382" height="62" rx="12" fill="#fff7f7" stroke="#fecaca"/>
<text x="106" y="309" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#7f1d1d">«Hazme un resumen de la</text>
<text x="106" y="330" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#7f1d1d">Revolución Industrial.»</text>
<g font-family="Inter, system-ui, sans-serif">
  <circle cx="106" cy="384" r="12" fill="#fee2e2"/><text x="106" y="389" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">?</text>
  <text x="130" y="390" font-size="18" fill="#46536a">Nivel y destinatario</text>
  <circle cx="106" cy="420" r="12" fill="#fee2e2"/><text x="106" y="425" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">?</text>
  <text x="130" y="426" font-size="18" fill="#46536a">Objetivo de la tarea</text>
  <circle cx="106" cy="456" r="12" fill="#fee2e2"/><text x="106" y="461" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">?</text>
  <text x="130" y="462" font-size="18" fill="#46536a">Extensión y formato</text>
  <circle cx="106" cy="492" r="12" fill="#fee2e2"/><text x="106" y="497" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">?</text>
  <text x="130" y="498" font-size="18" fill="#46536a">Límites y fuentes</text>
  <circle cx="106" cy="528" r="12" fill="#fee2e2"/><text x="106" y="533" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">?</text>
  <text x="130" y="534" font-size="18" fill="#46536a">Cómo comprobar</text>
</g>

<path d="M508 372 H548" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="528" y="358" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2563eb">TÚ</text>

<rect x="560" y="204" width="576" height="338" rx="20" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
<rect x="560" y="204" width="576" height="58" rx="20" fill="#f0fdf4"/>
<rect x="560" y="242" width="576" height="20" fill="#f0fdf4"/>
<text x="588" y="240" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#15803d">PETICIÓN PRECISA</text>
<rect x="584" y="278" width="528" height="42" rx="10" fill="#f8fafc" stroke="#e1e7f0"/>
<text x="602" y="304" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#0c1424">Nivel</text>
<text x="704" y="304" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#46536a">4.º de ESO · Historia</text>
<rect x="584" y="330" width="528" height="42" rx="10" fill="#f8fafc" stroke="#e1e7f0"/>
<text x="602" y="356" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#0c1424">Objetivo</text>
<text x="704" y="356" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#46536a">Plan de repaso de 45 minutos</text>
<rect x="584" y="382" width="528" height="42" rx="10" fill="#f8fafc" stroke="#e1e7f0"/>
<text x="602" y="408" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#0c1424">Formato</text>
<text x="704" y="408" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#46536a">Tabla: bloque, tiempo, pregunta</text>
<rect x="584" y="434" width="528" height="42" rx="10" fill="#f8fafc" stroke="#e1e7f0"/>
<text x="602" y="460" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#0c1424">Límites</text>
<text x="704" y="460" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#46536a">Solo los apuntes; si falta, «no consta»</text>
<rect x="584" y="486" width="528" height="42" rx="10" fill="#f8fafc" stroke="#e1e7f0"/>
<text x="602" y="512" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#0c1424">Prueba</text>
<text x="704" y="512" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#46536a">Una pregunta de control por bloque</text>

<rect x="64" y="562" width="1072" height="40" rx="10" fill="#1e3a8a"/>
<text x="92" y="588" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600" fill="#ffffff">Una instrucción precisa no es más larga por lucirse: es más corta porque elimina decisiones improvisadas.</text>
</svg>
